# SvelteKit → Netlify Functions via @sveltejs/adapter-netlify
# https://svelte.dev/docs/kit/adapter-netlify

[build]
	# Netlify still auto-detects pnpm from pnpm-lock.yaml before this runs.
	# We no-op that install (PNPM_FLAGS) and install with npm ourselves.
	command = "npm ci && npm run build"
	publish = "build"

[build.environment]
	NODE_VERSION = "22"
	# Make Netlify's automatic `pnpm install` a no-op (real install is npm ci above).
	PNPM_FLAGS = "--version"
	# Private GitHub Packages (@menzies-mariesta-com/*): set NODE_AUTH_TOKEN in the Netlify UI.
	# Token is read from .npmrc during npm ci.

[dev]
	command = "npm run dev"
	targetPort = 5173
	framework = "#custom"

# Fingerprinted Vite assets: long-cache immutable (adapter also sets related headers).
[[headers]]
	for = "/_app/immutable/*"
	[headers.values]
	Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
	for = "/og-medora.png"
	[headers.values]
	Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

[[headers]]
	for = "/og-medora.svg"
	[headers.values]
	Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

[[headers]]
	for = "/medora-logo.svg"
	[headers.values]
	Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"
