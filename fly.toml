# fly.toml app configuration file generated for heka on 2026-01-30T13:10:10+06:30
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'heka'
primary_region = 'sin'

[build]

[deploy]
  # Use npm so Fly's release machine does not run pnpm's dependency sync (full reinstall → OOM).
  # `db:seed` already runs `db:push` first (see package.json).
  release_command = "npm run db:seed"

  [deploy.release_command_vm]
    size = "shared-cpu-1x"
    memory = "1gb"

[http_service]
  internal_port = 5173
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
