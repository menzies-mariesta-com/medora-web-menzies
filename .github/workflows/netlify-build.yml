# Optional: build on GitHub (more RAM than default Netlify builders) and deploy artifacts only.
# Enable by adding NETLIFY_AUTH_TOKEN + NETLIFY_SITE_ID repo secrets and disabling
# auto-build on the Netlify site (Build & deploy → Continuous deployment → Stop builds).
name: Netlify production build

on:
  workflow_dispatch:
  push:
    branches: [netlify]

concurrency:
  group: netlify-production
  cancel-in-progress: true

permissions:
  contents: read
  deployments: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN }}

      - name: Build
        run: npm run build
        env:
          NODE_OPTIONS: --max-old-space-size=8192

      - name: Deploy to Netlify
        uses: nwtgck/actions-netlify@v3.0
        with:
          publish-dir: ./build
          production-deploy: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
          deploy-message: 'Deploy from GitHub Actions'
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        timeout-minutes: 5
