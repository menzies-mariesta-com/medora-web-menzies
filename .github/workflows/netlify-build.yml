# Build on GitHub (swap + tuned heap), deploy ./build to Netlify (no Netlify-side build).
# Secrets: NETLIFY_AUTH_TOKEN, NETLIFY_SITE_ID; optional NODE_AUTH_TOKEN for npm ci.
name: Netlify production build

on:
  workflow_dispatch:
  push:
    branches: [netlify]

concurrency:
  group: netlify-production
  cancel-in-progress: true

permissions:
  contents: read
  deployments: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      # Standard runners ~7 GiB RAM; Vite/Rollup can exceed that. Swap avoids exit 134/137.
      - name: Add swap for production build
        run: |
          sudo swapoff -a || true
          sudo fallocate -l 16G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN }}

      - name: Build
        run: |
          free -h
          npm run build:github

      - name: Deploy to Netlify
        uses: nwtgck/actions-netlify@v3.0
        with:
          publish-dir: ./build
          production-deploy: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
          deploy-message: 'Deploy from GitHub Actions'
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        timeout-minutes: 10
