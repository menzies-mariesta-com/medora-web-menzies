# Build on GitHub (swap + tuned heap), deploy ./build to Netlify (no Netlify-side build).
# Secrets: NETLIFY_AUTH_TOKEN, NETLIFY_SITE_ID; optional NODE_AUTH_TOKEN for npm ci.
name: Netlify production build

on:
  workflow_dispatch:
  push:
    branches: [netlify]

concurrency:
  group: netlify-production
  cancel-in-progress: true

permissions:
  contents: read
  deployments: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      # Standard runners ~7 GiB RAM; Vite/Rollup can exceed that. Swap avoids exit 134/137.
      - name: Add swap for production build
        run: |
          sudo swapoff -a || true
          sudo fallocate -l 24G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN }}

      - name: Build
        run: |
          free -h
          npm run build:github
        env:
          # Satisfy hooks/auth during prerender (values are not used for deploy secrets).
          DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci?sslmode=disable
          BETTER_AUTH_SECRET: github-actions-ci-build-placeholder-min-32-chars
          BETTER_AUTH_URL: https://medora-menzies.netlify.app
          BETTER_AUTH_BASE_URL: https://medora-menzies.netlify.app
          PUBLIC_APP_URL: https://medora-menzies.netlify.app

      - name: Verify Netlify secrets
        run: |
          if [ -z "$NETLIFY_AUTH_TOKEN" ]; then
            echo "::error::Repository secret NETLIFY_AUTH_TOKEN is missing. Netlify → User settings → Personal access tokens, then add the token under GitHub repo Settings → Secrets → Actions."
            exit 1
          fi
          if [ -z "$NETLIFY_SITE_ID" ]; then
            echo "::error::Repository secret NETLIFY_SITE_ID is missing. Netlify → Site configuration → Site details → Site ID."
            exit 1
          fi
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}

      - name: Verify Netlify build artifacts
        run: |
          test -d build || (echo "::error::Missing build/ — vite build failed?" && exit 1)
          test -f .netlify/functions-internal/sveltekit-render.mjs || (echo "::error::Missing .netlify/functions-internal — adapter-netlify output?" && exit 1)
          test -d .netlify/server || (echo "::error::Missing .netlify/server" && exit 1)

      # Use Netlify CLI (not a separate functions-dir upload). Internal functions live under
      # .netlify/functions-internal; CLI + netlify.toml deploy them with the static build/.
      - name: Deploy to Netlify
        run: |
          npx --yes netlify-cli@23 deploy --prod \
            --dir=build \
            --site="$NETLIFY_SITE_ID" \
            --message "Deploy from GitHub Actions"
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        timeout-minutes: 20
