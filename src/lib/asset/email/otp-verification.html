<!doctype html>
<html>
	<head>
		<meta charset="utf-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1.0"
		/>
		<title>Your verification code · Menzies Medora</title>
	</head>
	<body
		style="
			margin: 0;
			font-family:
				system-ui,
				-apple-system,
				Segoe UI,
				Roboto,
				sans-serif;
			background: #ecfaf5;
			padding: 28px;
		"
	>
		<div
			style="
				max-width: 420px;
				margin: 0 auto;
				background: #fff;
				border-radius: 16px;
				box-shadow: 0 4px 12px rgba(13, 148, 136, 0.12);
				overflow: hidden;
				border: 1px solid rgba(13, 148, 136, 0.15);
			"
		>
			<div
				style="
					height: 4px;
					background: linear-gradient(90deg, #0d9488, #70ecad);
				"
			></div>
			<div style="padding: 28px 24px 32px">
				<p
					style="
						margin: 0 0 8px;
						font-size: 12px;
						letter-spacing: 0.06em;
						text-transform: uppercase;
						color: #0d9488;
						font-weight: 600;
					"
				>
					Menzies Medora
				</p>
				<h1
					style="
						margin: 0 0 12px;
						font-size: 22px;
						line-height: 1.3;
						color: #134e4a;
					"
				>
					Your verification code
				</h1>
				<p style="margin: 0 0 20px; font-size: 15px; color: #475569; line-height: 1.5">
					{{intro}}
				</p>
				<p
					style="
						margin: 0 0 8px;
						font-size: 32px;
						letter-spacing: 0.35em;
						font-weight: 700;
						color: #0f766e;
						text-align: center;
						font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
					"
				>
					{{otp}}
				</p>
				<p style="margin: 16px 0 0; font-size: 13px; color: #64748b; line-height: 1.5">
					This code expires in 10 minutes. If you did not request it, you can ignore this email.
				</p>
			</div>
		</div>
	</body>
</html>
