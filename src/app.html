<!doctype html>

<html lang="%paraglide.lang%" data-theme="mineral" data-font="maple-mono">
	<head>
		<meta charset="utf-8" />

		<meta
			name="viewport"
			content="width=device-width, initial-scale=1"
		/>
		<link rel="icon" href="/favicon.ico" sizes="any" />
		<link rel="icon" type="image/svg+xml" href="/medora-logo.svg" />
		<link rel="apple-touch-icon" href="/medora-logo.svg" />

		<!--
			FOUC guard: restore Wash pigment + mode before paint.
			Keys match @menzies-mariesta-com/menzies-design-wash-ui (THEME_STORAGE_KEY / MODE_STORAGE_KEY).
		-->
		<script>
			(function () {
				try {
					var THEME_KEY = 'design-web-menzies-theme';
					var MODE_KEY = 'design-web-menzies-mode';
					var LEGACY_THEME = 'washfield-theme';
					var LEGACY_MODE = 'washfield-mode';
					var pigment =
						localStorage.getItem(THEME_KEY) ||
						localStorage.getItem(LEGACY_THEME) ||
						'mineral';
					var mode =
						localStorage.getItem(MODE_KEY) ||
						localStorage.getItem(LEGACY_MODE) ||
						'light';
					if (pigment.indexOf('|') !== -1) {
						pigment = pigment.split('|')[0] || 'mineral';
					}
					if (pigment.slice(-5) === '-dark') {
						pigment = pigment.slice(0, -5);
						mode = 'dark';
					}
					if (mode !== 'light' && mode !== 'dark') mode = 'light';
					document.documentElement.setAttribute(
						'data-theme',
						mode === 'dark' ? pigment + '-dark' : pigment
					);
				} catch (e) {}
			})();
		</script>

		<!--
			FOUC guard: restore selected typeface before paint.
			Key matches LocalStorageEnum.FONT / FontTool (`font`).
		-->
		<script>
			(function () {
				try {
					var FONT_KEY = 'font';
					var allowed = {
						'maple-mono': 1,
						fraunces: 1
					};
					var font = localStorage.getItem(FONT_KEY) || 'maple-mono';
					if (font.charAt(0) === '"') {
						try {
							font = JSON.parse(font);
						} catch (e) {}
					}
					if (!allowed[font]) font = 'maple-mono';
					document.documentElement.setAttribute('data-font', font);
				} catch (e) {}
			})();
		</script>

		<link rel="stylesheet" href="/medora-bootstrap-wash-theme.css" />
		<link rel="stylesheet" href="/medora-bootstrap-font.css" />
		<link rel="stylesheet" href="/medora-bootstrap-loading.css" />
		<link
			rel="preload"
			href="/fonts/wash/maple-mono-latin-700-normal.woff2"
			as="font"
			type="font/woff2"
			crossorigin=""
		/>
		<link
			rel="preload"
			href="/fonts/wash/maple-mono-latin-500-normal.woff2"
			as="font"
			type="font/woff2"
			crossorigin=""
		/>

		%sveltekit.head%
	</head>

	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
		<script>
			(function () {
				function usesBootstrapLoader(path) {
					if (path === '/auth' || path.indexOf('/auth/') === 0)
						return true;
					if (path === '/medora' || path.indexOf('/medora/') === 0)
						return true;
					if (
						path === '/onboarding' ||
						path.indexOf('/onboarding/') === 0
					)
						return true;
					return false;
				}
				if (!usesBootstrapLoader(window.location.pathname)) return;

				var root = document.createElement('div');
				root.id = 'medora-app-bootstrap-loader';
				root.setAttribute('role', 'status');
				root.setAttribute('aria-live', 'polite');
				root.setAttribute('aria-busy', 'true');
				root.innerHTML =
					'<div class="medora-bootstrap-loader-inner">' +
					'<img class="medora-bootstrap-mark" src="/medora-logo.svg" alt="" width="40" height="40" decoding="async" />' +
					'<div class="studio-load-stroke" aria-hidden="true">' +
					'<span class="studio-load-stroke__mark"></span>' +
					'</div>' +
					'<div class="studio-load-ink">' +
					'<p class="studio-load-ink__word">Medora Menzies</p>' +
					'</div>' +
					'</div>';
				var rootStyle = getComputedStyle(document.documentElement);
				var washVars = [
					'--color-base-100',
					'--color-base-200',
					'--color-base-content',
					'--color-primary',
					'--color-primary-content',
					'--color-secondary',
					'--color-accent',
					'--wash-a',
					'--wash-b',
					'--wash-c',
					'--ink-muted',
					'--ink-border',
					'--radius-box',
					'--size-selector'
				];
				for (var i = 0; i < washVars.length; i++) {
					root.style.setProperty(
						washVars[i],
						rootStyle.getPropertyValue(washVars[i])
					);
				}
				document.body.appendChild(root);
			})();
		</script>
	</body>
</html>
