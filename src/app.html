<!doctype html>

<html lang="%paraglide.lang%" data-theme="mineral">
	<head>
		<meta charset="utf-8" />

		<meta
			name="viewport"
			content="width=device-width, initial-scale=1"
		/>

		<!--
			FOUC guard: restore Wash pigment + mode before paint.
			Keys match @menzies-mariesta-com/menzies-design-wash-ui (THEME_STORAGE_KEY / MODE_STORAGE_KEY).
		-->
		<script>
			(function () {
				try {
					var THEME_KEY = 'design-web-menzies-theme';
					var MODE_KEY = 'design-web-menzies-mode';
					var LEGACY_THEME = 'washfield-theme';
					var LEGACY_MODE = 'washfield-mode';
					var pigment =
						localStorage.getItem(THEME_KEY) ||
						localStorage.getItem(LEGACY_THEME) ||
						'mineral';
					var mode =
						localStorage.getItem(MODE_KEY) ||
						localStorage.getItem(LEGACY_MODE) ||
						'light';
					if (pigment.indexOf('|') !== -1) {
						pigment = pigment.split('|')[0] || 'mineral';
					}
					if (pigment.slice(-5) === '-dark') {
						pigment = pigment.slice(0, -5);
						mode = 'dark';
					}
					if (mode !== 'light' && mode !== 'dark') mode = 'light';
					document.documentElement.setAttribute(
						'data-theme',
						mode === 'dark' ? pigment + '-dark' : pigment
					);
				} catch (e) {}
			})();
		</script>

		%sveltekit.head%
	</head>

	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
